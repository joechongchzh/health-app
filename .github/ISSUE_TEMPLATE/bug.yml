name: Bug 报告
description: 报告可复现的问题，请勿填写隐私数据或凭据
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    attributes:
      label: 问题描述
      description: 实际发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 看到…"
    validations:
      required: true
  - type: input
    attributes:
      label: 设备与系统
      placeholder: iPhone 15 / iOS 19.1 或 Pixel 9 / Android 16
    validations:
      required: true
  - type: input
    attributes:
      label: 浏览器与版本
      placeholder: Safari / Chrome
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 使用方式
      options: [浏览器, 主屏幕安装版]
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除邮箱验证码、API Key、Token 和真实健康隐私数据
          required: true
