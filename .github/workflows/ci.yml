name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/static-check.cjs
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix .ci-deps --no-save --package-lock=false playwright@1.62.1
      - run: node .ci-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify data migration, merge, recovery and cache transition
        run: HEALTH_TEST_NODE_MODULES="$PWD/.ci-deps/node_modules" node tests/preservation.cjs
      - name: Verify device configuration survives updates and synchronization
        run: HEALTH_TEST_NODE_MODULES="$PWD/.ci-deps/node_modules" node tests/config-preservation.cjs
      - name: Verify viewing an empty day cannot replace remote records
        run: HEALTH_TEST_NODE_MODULES="$PWD/.ci-deps/node_modules" node tests/sync-day-preservation.cjs
      - name: Verify synchronization between two independent devices
        run: HEALTH_TEST_NODE_MODULES="$PWD/.ci-deps/node_modules" node tests/two-device-sync.cjs
      - name: Verify newer HTML can replace an older offline cache without losing settings
        run: HEALTH_TEST_NODE_MODULES="$PWD/.ci-deps/node_modules" node tests/cache-update.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preservation-results
          path: test-results/
          retention-days: 14
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix .ci-deps --no-save --package-lock=false playwright@1.62.1
      - run: node .ci-deps/node_modules/playwright/cli.js install --with-deps chromium
      - run: HEALTH_TEST_NODE_MODULES="$PWD/.ci-deps/node_modules" node tests/legacy-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 14
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
